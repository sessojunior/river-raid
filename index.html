<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>River Raid Clone</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="hud" aria-label="Status do jogo">
    <div class="hud__item">
      <span class="hud__label">Pontos</span>
      <span class="hud__value" id="score">0</span>
    </div>
    <div class="hud__item">
      <span class="hud__label">Combustível</span>
      <span class="hud__value" id="fuel">100</span>
    </div>
    <div class="hud__item">
      <span class="hud__label">Vida</span>
      <span class="hud__value" id="life">3</span>
    </div>
  </header>

  <div class="controls">
    <span class="controls__hint">← → mover | ESPAÇO atirar</span>
  </div>

  <div class="game-over" id="gameOverScreen" aria-live="polite">
    <div class="game-over__panel">
      <h1 class="game-over__title">GAME OVER</h1>
      <p class="game-over__message">Seu avião foi abatido. Pressione Reiniciar para tentar de novo.</p>
      <button class="game-over__button" type="button" onclick="restartGame()">Reiniciar</button>
    </div>
  </div>

  <canvas id="game"></canvas>

  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/spawn.js"></script>
  <script src="js/score.js"></script>
  <script src="js/river-logic.js"></script>
  <script src="js/difficulty-logic.js"></script>
  <script src="js/collision-responses.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/river.js"></script>
  <script src="js/bullets.js"></script>
  <script src="js/player.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/fuel.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
